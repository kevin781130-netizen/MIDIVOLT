name: MIDIVOLT Conservative Hi-hat Ablation

# Retrospective Cut-23 cohort, exact source selection + aggregate score lock.
# Explicit one-off commit marker only. No torch, models or full dataset.
on:
  workflow_dispatch:
  push:
    branches:
      - feat/drum-audit-20261025

permissions:
  contents: read
  actions: read

jobs:
  conservative-ablation:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[hat-ablation-once]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 26
    env:
      STUDY_DIR: /tmp/midivolt-conservative-ablation
      GH_TOKEN: ${{ github.token }}
      PYTHONHASHSEED: '0'
    steps:
      - name: Check out MIDIVOLT revision
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only transcribe dependencies
        run: |
          python -m pip install "numpy>=1.23.5,<2" "scipy>=1.10,<2" \
            "pretty_midi>=0.2.10,<0.3" "requests>=2.31,<3" "remotezip>=0.12,<1"
      - name: Test actual retrospective ablation safety
        run: |
          python -m unittest discover -s tests/transcription -p 'test_hat_shape_ablation.py' -v
          python -m unittest discover -s tests/transcription -p 'test_hat_shape.py' -v
          python -m unittest discover -s tests/transcription -p 'test_hat_shape_validation.py' -v
      - name: Restore authentic Cut-21 and Cut-23 artifacts
        run: |
          mkdir -p "$STUDY_DIR/cut21" "$STUDY_DIR/cut23" "$STUDY_DIR/live"
          gh api repos/kevin781130-netizen/MIDIVOLT/actions/artifacts/12597917889/zip > "$STUDY_DIR/cut21.zip"
          gh api repos/kevin781130-netizen/MIDIVOLT/actions/artifacts/12599836462/zip > "$STUDY_DIR/cut23.zip"
          python -m zipfile -t "$STUDY_DIR/cut21.zip"
          python -m zipfile -t "$STUDY_DIR/cut23.zip"
          python -m zipfile -e "$STUDY_DIR/cut21.zip" "$STUDY_DIR/cut21"
          python -m zipfile -e "$STUDY_DIR/cut23.zip" "$STUDY_DIR/cut23"
          python - <<'PY'
          from pathlib import Path
          from midivolt.hat_shape_ablation import CUT23_PLAN_SHA256, _checksum
          p=Path('/tmp/midivolt-conservative-ablation/cut23/validation_selection_plan.json')
          assert _checksum(p) == CUT23_PLAN_SHA256
          print("Frozen historical selection SHA-256 validated.")
          PY
      - name: Download official small CSV
        run: |
          python -c "from pathlib import Path; from scripts.egmd_mini_real import get_small_csv; print(get_small_csv(Path('/tmp/midivolt-conservative-ablation/official.csv')))"
      - name: Recreate same Cut-23 Validation song selection and selected WAV/MIDI only
        run: |
          python -m scripts.egmd_hat_prepare \
            --csv "$STUDY_DIR/official.csv" --output "$STUDY_DIR/live" \
            --exclude-plan "$STUDY_DIR/cut21/validation_selection_plan.json" \
            --count 6 --fills 2 --extract-range \
            --official-cc-by-research-review
      - name: Compare Conservative with vs without spectral feature on identical audio
        run: |
          python -m midivolt.hat_shape_ablation \
            --manifest "$STUDY_DIR/live/validation_manifest_SOURCE_LICENSE_REVIEWED.json" \
            --selection-plan "$STUDY_DIR/live/validation_selection_plan.json" \
            --original-metrics "$STUDY_DIR/cut23/hat_shape_results.json" \
            --output "$STUDY_DIR/conservative_ablation_result.json"
      - name: Upload research metrics JSON only; NEVER WAV/MIDI
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: midivolt-conservative-hat-ablation-metrics
          path: |
            /tmp/midivolt-conservative-ablation/conservative_ablation_result.json
          if-no-files-found: warn
          retention-days: 14
