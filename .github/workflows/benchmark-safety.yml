name: MIDIVOLT Benchmark Safety

on:
  push:
    branches:
      - main
      - feat/benchmark-foundation
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmark-safety-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark-checks:
    name: Inventory and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate dataset inventory structure
        run: python tests/benchmark/validate_manifest.py --mode inventory

      - name: Run validator unit tests
        run: python -m unittest discover -s tests/benchmark -p 'test_*.py' -v

      - name: Install lightweight MIDI test dependency
        run: python -m pip install "pretty_midi>=0.2.10,<0.3" "numpy>=1.23.5,<2" "scipy>=1.10,<2"

      - name: Test independent WAV to MIDI routing
        run: python -m unittest discover -s tests/transcription -p 'test_*.py' -v

  commercial-release-gate:
    name: Strict commercial clearance
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
    needs: benchmark-checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Refuse unapproved datasets in commercial release
        run: python tests/benchmark/validate_manifest.py --mode commercial

  basic-pitch-e2e:
    name: Actual model WAV-to-MIDI smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up compatible Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Basic Pitch and test runtime
        run: python -m pip install -r requirements-transcribe.txt

      - name: Run full inference with generated WAV and reference MIDI
        env:
          MIDIVOLT_RUN_E2E: '1'
          MIDIVOLT_SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/midivolt-smoke
        run: python -m unittest discover -s tests/transcription -p 'test_basic_pitch_e2e.py' -v

      - name: Upload MIDI and note-accuracy diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: midivolt-basic-pitch-smoke
          path: ${{ runner.temp }}/midivolt-smoke/
          if-no-files-found: warn
          retention-days: 7
