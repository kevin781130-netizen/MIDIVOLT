name: Windows Developer RC

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-wheel-and-zip:
    # K11: actual PR #9 Windows packaging verification, no merge into main.
    if: startsWith(github.head_ref, 'integration/') || (github.event_name == 'pull_request' && github.event.pull_request.number == 9)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build pure Python wheel
        run: |
          python -m pip install --disable-pip-version-check "build>=1.2,<2"
          python -m build --wheel --outdir dist
      - name: Validate actual wheel contents and CLI metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $wheels = @(Get-ChildItem dist -File -Filter "midivolt-*.whl")
          if ($wheels.Count -ne 1) { throw "Expected one wheel for release audit" }
          # Audit source module before package install, then separately install
          # the built wheel into a clean, isolated Python 3.11 environment.
          $env:PYTHONPATH = (Join-Path (Get-Location) "src")
          python -m midivolt.beta_gate_cli --wheel $wheels[0].FullName --developer-rc --out dist/wheel-audit.json
          if ($LASTEXITCODE -ne 0) { throw "Actual wheel package audit failed" }
      - name: Install wheel in clean Python 3.11 and smoke CLI
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $venv = Join-Path $env:RUNNER_TEMP "midivolt-wheel-smoke"
          py -3.11 -m venv $venv
          if ($LASTEXITCODE -ne 0) { throw "venv creation failed" }
          $python = Join-Path $venv "Scripts\python.exe"
          $wheels = @(Get-ChildItem -Path dist -File -Filter "midivolt-*.whl")
          if ($wheels.Count -ne 1) { throw "Expected a single MIDIVOLT wheel" }
          & $python -m pip install --no-input $wheels[0].FullName
          if ($LASTEXITCODE -ne 0) { throw "wheel install failed" }
          & pwsh -NoProfile -NonInteractive -File packaging/windows/Smoke-MIDIVOLT.ps1 -PythonExe $python
          if ($LASTEXITCODE -ne 0) { throw "offline MIDI smoke failed" }
      - name: Build Windows installer ZIP (Python and dependencies not bundled)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $target = "dist\windows-rc"
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          Copy-Item (Get-ChildItem -Path dist -Filter "midivolt-*.whl" -File).FullName $target
          Copy-Item packaging/windows/Install-MIDIVOLT.ps1 $target
          Copy-Item packaging/windows/Smoke-MIDIVOLT.ps1 $target
          Copy-Item packaging/windows/README-Windows.txt $target
          Copy-Item LICENSE $target
          Copy-Item THIRD_PARTY_NOTICES.md $target
          $zip = "dist\MIDIVOLT-Windows-0.1.0rc1-py311.zip"
          Compress-Archive -Path "$target\*" -DestinationPath $zip
          $digest = (Get-FileHash -Algorithm SHA256 -Path $zip).Hash.ToLowerInvariant()
          "$digest  MIDIVOLT-Windows-0.1.0rc1-py311.zip" |
            Set-Content -Path "$zip.sha256" -Encoding ascii
          Write-Host "ARTIFACT_SHA256=$digest"
      - name: Validate ZIP membership, matching wheel and checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $wheels = @(Get-ChildItem dist -File -Filter "midivolt-*.whl")
          if ($wheels.Count -ne 1) { throw "Expected one independently audited wheel" }
          $zip = "dist/MIDIVOLT-Windows-0.1.0rc1-py311.zip"
          $checksumLines = @(Get-Content "$zip.sha256")
          if ($checksumLines.Count -ne 1) { throw "Expected one ZIP checksum line" }
          if ($checksumLines[0] -notmatch '^([0-9a-f]{64})  MIDIVOLT-Windows-0\.1\.0rc1-py311\.zip$') {
            throw "Invalid ZIP checksum manifest"
          }
          $expectedZipSha = $Matches[1]
          $env:PYTHONPATH = (Join-Path (Get-Location) "src")
          python -m midivolt.beta_gate_cli --wheel $wheels[0].FullName --windows-zip $zip --zip-sha256 $expectedZipSha --developer-rc --out dist/windows-package-audit.json
          if ($LASTEXITCODE -ne 0) { throw "Actual Windows ZIP package audit failed" }
      - name: Unpack ZIP and exercise actual Windows PowerShell installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $extracted = Join-Path $env:RUNNER_TEMP "midivolt-rc-unpacked"
          $installed = Join-Path $env:RUNNER_TEMP "midivolt-rc-installed"
          Expand-Archive -Path dist/MIDIVOLT-Windows-0.1.0rc1-py311.zip -DestinationPath $extracted
          $installer = Join-Path $extracted "Install-MIDIVOLT.ps1"
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $installer -AllowNetwork -Destination $installed
          if ($LASTEXITCODE -ne 0) { throw "Packaged PowerShell installer failed" }
          if (-not (Test-Path (Join-Path $installed "Scripts/midivolt.exe"))) {
            throw "Installer did not produce MIDIVOLT executable"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: MIDIVOLT-Windows-0.1.0rc1
          path: |
            dist/MIDIVOLT-Windows-0.1.0rc1-py311.zip
            dist/MIDIVOLT-Windows-0.1.0rc1-py311.zip.sha256
            dist/wheel-audit.json
            dist/windows-package-audit.json
          if-no-files-found: error
          retention-days: 30
